name: Complete upstream import
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import and patch original complete project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f app/src/main/java/com/huanchengfly/tieba/post/MainActivityV2.kt ]]; then
            echo "Already imported"
            exit 0
          fi
          git clone --depth 1 --branch 4.0-dev https://github.com/HuanCheng65/TiebaLite.git /tmp/tieba-upstream
          rsync -a --exclude='.git/' --exclude='.github/workflows/' --exclude='LICENSE' --exclude='README.md' /tmp/tieba-upstream/ ./
          cp /tmp/tieba-upstream/README.md README.md
          python3 tools/modernize_tieba.py
          cat > .github/workflows/android-ci.yml <<'YAML'
          name: Android CI
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            build-and-test:
              runs-on: ubuntu-latest
              timeout-minutes: 40
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: gradle/actions/setup-gradle@v4
                - uses: android-actions/setup-android@v3
                  continue-on-error: true
                - name: SDK platform 35
                  continue-on-error: true
                  run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
                - name: Assemble and test
                  run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
          YAML
          rm -f .github/workflows/import-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import full TiebaLite native app with new floating navigation"
          if ! git push origin HEAD:main; then
            git fetch origin main
            if git cat-file -e origin/main:app/src/main/java/com/huanchengfly/tieba/post/MainActivityV2.kt; then
              echo "Another workflow has already imported the complete application."
            else
              exit 1
            fi
          fi
