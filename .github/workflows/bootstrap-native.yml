name: Bootstrap Tieba Native from upstream
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-native.yml"

permissions:
  contents: write

jobs:
  import-and-build:
    if: github.repository == 'Ktclat/Tieba-Native'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import the complete upstream (including binary resources)
        id: import
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 4.0-dev https://github.com/HuanCheng65/TiebaLite.git /tmp/tieba-upstream
          rsync -a --exclude='.git/' --exclude='.github/workflows/' --exclude='LICENSE' --exclude='README.md' /tmp/tieba-upstream/ ./
          cp /tmp/tieba-upstream/README.md README.md
          python3 tools/modernize_tieba.py
          cat > .github/workflows/android-ci.yml <<'YAML'
          name: Android CI
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            build-and-test:
              runs-on: ubuntu-latest
              timeout-minutes: 40
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: gradle/actions/setup-gradle@v4
                - uses: android-actions/setup-android@v3
                  continue-on-error: true
                - name: SDK platform 35
                  continue-on-error: true
                  run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
                - name: Assemble and run unit tests
                  run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
          YAML
          git status --short | head -30

      - name: Setup JDK 17
        if: steps.import.outcome == 'success'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.import.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        if: steps.import.outcome == 'success'
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        if: steps.import.outcome == 'success'
        continue-on-error: true
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          else
            echo "sdkmanager unavailable; preserving source and letting CI report the issue"
          fi

      - name: Compile and unit tests
        id: verify
        if: steps.import.outcome == 'success'
        continue-on-error: true
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Commit complete imported project to main
        if: steps.import.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: import TiebaLite with native floating navigation and Android optimizations"
            git push origin HEAD:main
          fi

      - name: Fail if initial build failed
        if: steps.verify.outcome == 'failure'
        run: |
          echo "Code pushed to main. Build failed; see compile step for diagnostics."
          exit 1
