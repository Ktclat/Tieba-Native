name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: Optional full commit SHA with a previous successful debug APK for frame comparison
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      apk-uploaded: ${{ steps.upload-apk.outcome == 'success' }}
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Cache Robolectric Android runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: ${{ runner.os }}-robolectric-${{ hashFiles('app/build.gradle.kts') }}
      - name: Build debug APK
        id: pack
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          ./gradlew :app:assembleDebug --stacktrace
          base_name=$(sed -n 's/^versionName=//p' application.properties)
          base_code=$(sed -n 's/^versionCodeBase=//p' application.properties)
          version_name="${base_name}+${SOURCE_SHA:0:12}"
          [[ "$base_code" =~ ^[0-9]+$ ]]
          commit_count=$(git rev-list --count "$SOURCE_SHA")
          version_code=$((base_code + commit_count))
          apk="app/build/outputs/apk/debug/Tieba-Native-${version_name}-debug.apk"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          package=$(head -n 1 <<< "$badging")
          [[ "$package" == *"versionName='$version_name'"* && "$package" == *"versionCode='$version_code'"* ]]
          printf 'apk=%s\n' "$apk" >> "$GITHUB_OUTPUT"
          printf 'Built `%s` (Android versionCode `%s`) from `%s`.\n' "$version_name" "$version_code" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        id: upload-apk
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: Tieba-Native-Debug
          path: ${{ steps.pack.outputs.apk }}
          if-no-files-found: error
          retention-days: 7
      - name: Build device review instrumentation
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace
      - name: Upload device review instrumentation
        uses: actions/upload-artifact@v6
        with:
          name: Tieba-Native-Device-Tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Run JVM and Compose regression tests
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        env:
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Upload test reports and UI review screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Tieba-Native-UI-Regression
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/ui-screenshots/
            build/reports/ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
  review-installed-ui:
    needs: build-and-test
    if: ${{ !cancelled() && needs.build-and-test.outputs.apk-uploaded == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: Tieba-Native-Debug
          path: review-apk
      - uses: actions/download-artifact@v5
        with:
          name: Tieba-Native-Device-Tests
          path: review-tests
      - name: Locate a comparable APK from the base commit
        id: baseline
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.payload.pull_request?.base.sha ||
              context.payload.inputs?.baseline_commit || context.payload.before;
            if (!sha || !/^[a-f0-9]{40}$/i.test(sha)) return;
            const repo = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: "android-ci.yml", head_sha: sha, status: "success", per_page: 10
            });
            for (const run of runs.data.workflow_runs) {
              const files = await github.rest.actions.listWorkflowRunArtifacts({
                ...repo, run_id: run.id, name: "Tieba-Native-Debug"
              });
              if (files.data.artifacts.some(artifact => !artifact.expired)) {
                core.setOutput("run", run.id);
                core.setOutput("sha", run.head_sha);
                return;
              }
            }
            core.info("No retained APK for the base commit. Only the current build will be measured.");
      - name: Download the base APK for same-emulator measurements
        if: steps.baseline.outputs.run != ''
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run }}
          name: Tieba-Native-Debug
          path: baseline-apk
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Select the Pixel phone profile
        id: phone
        run: |
          devices=$("$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device)
          if [[ "$devices" == *'"pixel_9"'* ]]; then
            echo "profile=pixel_9" >> "$GITHUB_OUTPUT"
          else
            # Older SDK images still use the same Pixel 9 viewport set by configure_phone().
            echo "profile=pixel_5" >> "$GITHUB_OUTPUT"
          fi
      - name: Exercise the installed app and capture Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ steps.phone.outputs.profile }}
          # Use SwiftShader GLES for WebView on a headless runner without a Vulkan GPU.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: |
            if ls baseline-apk/*.apk >/dev/null 2>&1; then python3 tools/capture_android_ui.py --baseline baseline-apk/*.apk build/reports/device-screenshots/baseline || touch "$RUNNER_TEMP/phone-review-failed"; adb uninstall com.huanchengfly.tieba.post || true; fi
            python3 tools/capture_android_ui.py review-apk/*.apk build/reports/device-screenshots || touch "$RUNNER_TEMP/phone-review-failed"
            python3 tools/review_android_phone.py review-tests/*.apk build/reports/device-screenshots || touch "$RUNNER_TEMP/phone-review-failed"
            python3 tools/profile_android_ui.py review-apk/*.apk build/reports/device-frames --baseline-dir baseline-apk --baseline-sha "${{ steps.baseline.outputs.sha }}" --candidate-sha "${{ github.event.pull_request.head.sha || github.sha }}" --reset-emulator-app-data || touch "$RUNNER_TEMP/phone-review-failed"
            test ! -e "$RUNNER_TEMP/phone-review-failed"
      - name: Record host diagnostics if the emulator exits
        if: failure()
        run: |
          mkdir -p build/reports/device-screenshots
          {
            free -h
            df -h "$RUNNER_TEMP"
            if [[ -r /sys/fs/cgroup/memory.events ]]; then cat /sys/fs/cgroup/memory.events; fi
            sudo journalctl -k --since '35 minutes ago' --no-pager | grep -Ei 'out of memory|oom-kill|killed process|qemu|emulator|segfault' || true
          } > build/reports/device-screenshots/runner-health.txt
      - name: Upload emulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Tieba-Native-Android-Screens
          path: build/reports/device-screenshots
          if-no-files-found: warn
          retention-days: 14
      - name: Upload frame timings, device settings and scroll evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Tieba-Native-Frame-Timings
          path: build/reports/device-frames
          if-no-files-found: warn
          retention-days: 14

  cleanup-merged-test-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ui/native-settings-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify merged head and remove temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          read_ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/ui/native-settings-polish"
          if current=$(gh api "$read_ref" --jq '.object.sha' 2>ref-error.txt); then
            if [[ "$current" != "$EXPECTED_SHA" ]]; then
              echo "Branch changed since review; refusing to delete it." >&2
              exit 1
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/ui/native-settings-polish"
          elif grep -q 'HTTP 404' ref-error.txt; then
            echo "Temporary branch is already absent."
          else
            cat ref-error.txt >&2
            exit 1
          fi
